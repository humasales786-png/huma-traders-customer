<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Huma Customer - Solapur Online Kirana</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#065f46">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 antialiased selection:bg-emerald-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, createContext, useContext } = React;

    // Lucide Icon Helper Component for Browser CDN
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} class={className} {...props}></i>;
    };

    const CATEGORIES_DATA = [
      { id: 'atta-flour', name: 'Atta & Flour', icon: '🌾' },
      { id: 'rice', name: 'Rice & Products', icon: '🍚' },
      { id: 'dal-pulses', name: 'Dal & Pulses', icon: '🫘' },
      { id: 'oil-ghee', name: 'Oil & Ghee', icon: '🪔' },
      { id: 'spices-masala', name: 'Spices & Masala', icon: '🌶️' },
      { id: 'dry-fruits', name: 'Dry Fruits & Nuts', icon: '🥜' },
      { id: 'snacks-biscuits', name: 'Biscuits & Snacks', icon: '🍪' },
      { id: 'beverages', name: 'Beverages', icon: '☕' }
    ];

    const HERO_SLIDES = [
      {
        id: 'slide-1',
        badge: 'Direct Solapur Mandi Wholesale Rates',
        title: 'Fresh Grocery Delivered To Your Doorstep',
        image: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=1200'
      }
    ];

    const MONTHLY_BUNDLES = [
      {
        id: 'bndl-1',
        name: 'Small Family Ration Box (2-3 Members)',
        price: 1499,
        mrp: 1850,
        items: ['Aashirvaad Atta 10KG', 'Solapur Kolam Rice 5KG', 'Toor Dal 2KG', 'Sunflower Oil 2L'],
        tag: 'Popular'
      },
      {
        id: 'bndl-2',
        name: 'Medium Family Ration Box (4-6 Members)',
        price: 2899,
        mrp: 3500,
        items: ['Aashirvaad Atta 20KG', 'Kolam Rice 10KG', 'Toor Dal 3KG', 'Ghee 1L', 'Oil 5L'],
        tag: 'Best Value'
      }
    ];

    const MOCK_PRODUCTS = [
      {
        id: 'prod-101',
        name: 'Aashirvaad Shuddh Chakki Atta',
        brand: 'Aashirvaad',
        mrp: 380,
        price: 319,
        unit: '10 KG',
        isLoose: false,
        image: 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&q=80&w=600',
        discount: 16
      },
      {
        id: 'prod-102',
        name: 'Premium Solapur Kolam Rice (Loose)',
        brand: 'Huma Direct',
        mrp: 75,
        price: 62,
        unit: '1 KG',
        isLoose: true,
        looseOptions: [0.5, 1, 2, 5, 10],
        image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=600',
        discount: 17
      },
      {
        id: 'prod-103',
        name: 'Fortune Sunlite Refined Sunflower Oil',
        brand: 'Fortune',
        mrp: 175,
        price: 139,
        unit: '1 L',
        isLoose: false,
        image: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&q=80&w=600',
        discount: 20
      },
      {
        id: 'prod-104',
        name: 'Unpolished Toor Dal / Arhar Dal (Loose)',
        brand: 'Tata Sampann',
        mrp: 160,
        price: 135,
        unit: '1 KG',
        isLoose: true,
        looseOptions: [0.5, 1, 2, 5],
        image: 'https://images.unsplash.com/photo-1515543237350-b3eea1ec8082?auto=format&fit=crop&q=80&w=600',
        discount: 15
      }
    ];

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [currentRoute, setCurrentRoute] = useState('home');
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState(['prod-102']);
      const [searchQuery, setSearchQuery] = useState('');
      const [humaCoins, setHumaCoins] = useState(120);
      const [isVoiceModalOpen, setIsVoiceModalOpen] = useState(false);
      const [isListModalOpen, setIsListModalOpen] = useState(false);
      const [pastedListText, setPastedListText] = useState('');
      const [deliverySlot, setDeliverySlot] = useState('express');
      const [isScratchCardOpen, setIsScratchCardOpen] = useState(false);
      const [scratchedDiscount, setScratchedDiscount] = useState(0);

      const navigateTo = (route) => {
        setCurrentRoute(route);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const addToCart = (product, looseQty = 1) => {
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.selectedLooseQty === (product.isLoose ? looseQty : undefined));
          if (existingIndex > -1) {
            const updated = [...prev];
            updated[existingIndex].quantity += 1;
            return updated;
          }
          return [...prev, {
            ...product,
            quantity: 1,
            selectedLooseQty: product.isLoose ? looseQty : 1,
            effectivePrice: product.isLoose ? product.price * looseQty : product.price,
            effectiveMrp: product.isLoose ? product.mrp * looseQty : product.mrp
          }];
        });
      };

      const addBundleToCart = (bundle) => {
        MOCK_PRODUCTS.slice(0, 2).forEach(prod => addToCart(prod));
        setHumaCoins(prev => prev + 50);
        navigateTo('cart');
      };

      const processPastedList = () => {
        if (!pastedListText.trim()) return;
        MOCK_PRODUCTS.slice(0, 2).forEach(p => addToCart(p));
        setIsListModalOpen(false);
        setPastedListText('');
        navigateTo('cart');
      };

      const updateCartQty = (cartItemIndex, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter((_, idx) => idx !== cartItemIndex));
          return;
        }
        setCart(prev => {
          const updated = [...prev];
          updated[cartItemIndex].quantity = newQty;
          return updated;
        });
      };

      const toggleWishlist = (productId) => {
        setWishlist(prev => prev.includes(productId) ? prev.filter(id => id !== productId) : [...prev, productId]);
      };

      const cartSubtotal = useMemo(() => cart.reduce((acc, item) => acc + (item.effectivePrice * item.quantity), 0), [cart]);
      const deliveryCharge = cartSubtotal >= 499 || cartSubtotal === 0 ? 0 : 35;
      const grandTotal = Math.max(0, cartSubtotal - scratchedDiscount + deliveryCharge);

      const value = {
        currentRoute, navigateTo, cart, addToCart, addBundleToCart,
        updateCartQty, wishlist, toggleWishlist, searchQuery, setSearchQuery,
        cartSubtotal, deliveryCharge, grandTotal, humaCoins,
        isVoiceModalOpen, setIsVoiceModalOpen, isListModalOpen, setIsListModalOpen,
        pastedListText, setPastedListText, processPastedList, deliverySlot, setDeliverySlot,
        isScratchCardOpen, setIsScratchCardOpen, scratchedDiscount, setScratchedDiscount
      };

      return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    };

    const useApp = () => useContext(AppContext);

    const HumaLogo = () => (
      <div className="flex items-center gap-2 cursor-pointer">
        <div className="w-9 h-9 rounded-full border border-emerald-500 bg-white p-1 flex items-center justify-center shadow-xs shrink-0">
          <span className="text-xl">🛒</span>
        </div>
        <div>
          <span className="text-base font-black tracking-tight text-emerald-950 block leading-none">
            HUMA <span className="text-emerald-700">CUSTOMER</span>
          </span>
          <span className="text-[9px] text-slate-500 font-bold tracking-wider uppercase block mt-0.5">
            SOLAPUR ONLINE STORE
          </span>
        </div>
      </div>
    );

    const Header = () => {
      const { cart, wishlist, navigateTo, searchQuery, setSearchQuery, humaCoins, setIsVoiceModalOpen, setIsListModalOpen } = useApp();
      const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

      return (
        <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-xs">
          <div className="bg-emerald-900 text-emerald-50 text-[11px] px-3 py-1.5 text-center flex items-center justify-between font-medium">
            <span>🚚 Solapur Express Delivery | FREE above ₹499!</span>
            <div className="flex items-center gap-1 bg-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-bold text-amber-300">
              <Icon name="award" className="w-3 h-3 text-amber-300" />
              <span>{humaCoins} Coins</span>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-3 py-2">
            <div className="flex items-center justify-between gap-2">
              <div onClick={() => navigateTo('home')}>
                <HumaLogo />
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsListModalOpen(true)} className="flex items-center gap-1 bg-amber-50 text-amber-900 border border-amber-200 px-2 py-1 rounded-lg text-xs font-bold">
                  <Icon name="file-text" className="w-3.5 h-3.5 text-amber-700" />
                  <span className="hidden sm:inline">Upload Parchi</span>
                </button>
                <button onClick={() => navigateTo('wishlist')} className="p-1.5 text-slate-700 relative">
                  <Icon name="heart" className="w-5 h-5" />
                  {wishlist.length > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                      {wishlist.length}
                    </span>
                  )}
                </button>
                <button onClick={() => navigateTo('cart')} className="p-1.5 text-slate-700 relative">
                  <Icon name="shopping-bag" className="w-5 h-5" />
                  {cartCount > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                      {cartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>

            <div className="mt-2 relative flex items-center">
              <input
                type="text"
                placeholder="Search Atta, Rice, Dal, Oil..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-slate-50 border border-slate-300 rounded-full py-2 pl-9 pr-20 text-xs text-slate-800 focus:outline-none"
              />
              <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3" />
              <button onClick={() => setIsVoiceModalOpen(true)} className="absolute right-12 text-emerald-800 p-1">
                <Icon name="mic" className="w-4 h-4" />
              </button>
              <button onClick={() => navigateTo('shop')} className="absolute right-1 bg-emerald-800 text-white text-xs font-bold px-3 py-1 rounded-full">
                Search
              </button>
            </div>
          </div>
        </header>
      );
    };

    const ProductCard = ({ product }) => {
      const { addToCart, wishlist, toggleWishlist, cart } = useApp();
      const [selectedLooseQty, setSelectedLooseQty] = useState(1);
      const isWishlisted = wishlist.includes(product.id);
      const cartItem = cart.find(item => item.id === product.id);

      const calculatedPrice = product.isLoose ? product.price * selectedLooseQty : product.price;

      return (
        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-2xs flex flex-col justify-between relative">
          <button onClick={() => toggleWishlist(product.id)} className="absolute top-2 right-2 z-10 w-7 h-7 rounded-full bg-white/90 flex items-center justify-center shadow-xs">
            <Icon name="heart" className={`w-3.5 h-3.5 ${isWishlisted ? 'fill-rose-500 text-rose-500' : 'text-slate-600'}`} />
          </button>

          <div className="aspect-square w-full bg-slate-50 overflow-hidden">
            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
          </div>

          <div className="p-2 flex-1 flex flex-col justify-between">
            <div>
              <p className="text-[9px] font-bold text-emerald-700 uppercase">{product.brand}</p>
              <h3 className="text-xs font-bold text-slate-800 line-clamp-2">{product.name}</h3>
            </div>

            <div className="mt-2 flex items-center justify-between">
              <span className="text-xs font-black text-slate-900">₹{calculatedPrice}</span>
              <button onClick={() => addToCart(product, selectedLooseQty)} className="px-2 py-1 bg-emerald-800 text-white text-xs font-bold rounded-lg">
                + ADD
              </button>
            </div>
          </div>
        </div>
      );
    };

    const HomePage = () => {
      const { navigateTo, addBundleToCart, setIsListModalOpen } = useApp();

      return (
        <div className="space-y-4 pb-20">
          <div className="relative rounded-xl overflow-hidden bg-emerald-950 text-white p-4">
            <span className="bg-amber-400 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full">Solapur Direct</span>
            <h1 className="text-lg font-black mt-1">Fresh Grocery Delivered To Your Doorstep</h1>
            <button onClick={() => navigateTo('shop')} className="mt-3 bg-emerald-800 text-white text-xs font-bold px-4 py-2 rounded-lg">Shop Now →</button>
          </div>

          <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl flex items-center justify-between">
            <div>
              <h3 className="text-xs font-bold text-amber-950">Haath Se Likhi Ration Parchi Upload Karo</h3>
              <p className="text-[10px] text-amber-800">Directly paste your list</p>
            </div>
            <button onClick={() => setIsListModalOpen(true)} className="bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Upload</button>
          </div>

          <section className="space-y-2">
            <h2 className="text-sm font-bold text-slate-900">Categories</h2>
            <div className="flex gap-2 overflow-x-auto pb-1">
              {CATEGORIES_DATA.map(cat => (
                <div key={cat.id} onClick={() => navigateTo('shop')} className="shrink-0 p-2 w-20 bg-white border rounded-xl text-center cursor-pointer">
                  <span className="text-xl">{cat.icon}</span>
                  <p className="text-[10px] font-bold text-slate-800 mt-0.5">{cat.name}</p>
                </div>
              ))}
            </div>
          </section>

          <section className="space-y-2">
            <h2 className="text-sm font-bold text-slate-900">Featured Products</h2>
            <div className="grid grid-cols-2 gap-2">
              {MOCK_PRODUCTS.map(product => <ProductCard key={product.id} product={product} />)}
            </div>
          </section>
        </div>
      );
    };

    const CartPage = () => {
      const { cart, updateCartQty, grandTotal, setIsScratchCardOpen, scratchedDiscount } = useApp();

      return (
        <div className="space-y-3 pb-20">
          <h1 className="text-sm font-bold text-slate-900">Your Cart</h1>
          {cart.length === 0 ? (
            <div className="bg-white p-6 rounded-xl border text-center text-xs text-slate-500">Cart is empty.</div>
          ) : (
            <div className="space-y-2">
              {cart.map((item, idx) => (
                <div key={idx} className="bg-white p-2.5 rounded-xl border flex justify-between items-center text-xs">
                  <div>
                    <p className="font-bold text-slate-800">{item.name}</p>
                    <p className="text-slate-500">₹{item.effectivePrice} x {item.quantity}</p>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => updateCartQty(idx, item.quantity - 1)} className="w-5 h-5 bg-slate-100 font-bold rounded">-</button>
                    <span>{item.quantity}</span>
                    <button onClick={() => updateCartQty(idx, item.quantity + 1)} className="w-5 h-5 bg-slate-100 font-bold rounded">+</button>
                  </div>
                </div>
              ))}
              <div className="bg-white p-3 rounded-xl border flex justify-between items-center font-bold text-sm">
                <span>Grand Total:</span>
                <span className="text-emerald-800">₹{grandTotal}</span>
              </div>
            </div>
          )}
        </div>
      );
    };

    const BottomNav = () => {
      const { currentRoute, navigateTo, cart } = useApp();
      const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40">
          <div className="grid grid-cols-4 h-12">
            <button onClick={() => navigateTo('home')} className={`flex flex-col items-center justify-center ${currentRoute === 'home' ? 'text-emerald-800 font-bold' : 'text-slate-600'}`}>
              <Icon name="home" className="w-4 h-4" />
              <span className="text-[10px]">Home</span>
            </button>
            <button onClick={() => navigateTo('shop')} className={`flex flex-col items-center justify-center ${currentRoute === 'shop' ? 'text-emerald-800 font-bold' : 'text-slate-600'}`}>
              <Icon name="shopping-bag" className="w-4 h-4" />
              <span className="text-[10px]">Shop</span>
            </button>
            <button onClick={() => navigateTo('wishlist')} className={`flex flex-col items-center justify-center ${currentRoute === 'wishlist' ? 'text-emerald-800 font-bold' : 'text-slate-600'}`}>
              <Icon name="heart" className="w-4 h-4" />
              <span className="text-[10px]">Wishlist</span>
            </button>
            <button onClick={() => navigateTo('cart')} className={`flex flex-col items-center justify-center relative ${currentRoute === 'cart' ? 'text-emerald-800 font-bold' : 'text-slate-600'}`}>
              <Icon name="shopping-bag" className="w-4 h-4" />
              {cartCount > 0 && (
                <span className="absolute top-1 right-6 bg-rose-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">
                  {cartCount}
                </span>
              )}
              <span className="text-[10px]">Cart</span>
            </button>
          </div>
        </div>
      );
    };

    const App = () => {
      const { currentRoute } = useApp();
      return (
        <div className="min-h-screen bg-slate-50">
          <Header />
          <main className="max-w-7xl mx-auto px-3 py-3">
            {currentRoute === 'home' && <HomePage />}
            {currentRoute === 'shop' && (
              <div className="grid grid-cols-2 gap-2 pb-20">
                {MOCK_PRODUCTS.map(product => <ProductCard key={product.id} product={product} />)}
              </div>
            )}
            {currentRoute === 'cart' && <CartPage />}
            {currentRoute === 'wishlist' && <div className="text-xs text-slate-500 text-center py-6">Wishlist items here</div>}
          </main>
          <BottomNav />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
