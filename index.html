<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huma Traders - Online Kirana Store Solapur</title>
    
    <!-- PWA Web App Manifest Link -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#065f46" />
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <!-- Inline Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    </script>

    <!-- React App Code -->
    <script type="text/babel">
      const { useState } = React;

      function CustomerApp() {
        const [products] = useState([
          { id: 1, name: 'Toor Dal (Premium)', price: 135, unit: 'kg', image: '🌾' },
          { id: 2, name: 'Sugar / Sakhar', price: 42, unit: 'kg', image: '🍬' },
          { id: 3, name: 'Groundnut Oil (15L)', price: 2450, unit: 'tin', image: '🛢️' },
          { id: 4, name: 'Lokwan Wheat', price: 38, unit: 'kg', image: '🌾' }
        ]);

        const [cart, setCart] = useState([]);
        const [showCart, setShowCart] = useState(false);
        const [orderPlaced, setOrderPlaced] = useState(false);

        const addToCart = (product) => {
          const existing = cart.find(c => c.id === product.id);
          if (existing) {
            setCart(cart.map(c => c.id === product.id ? { ...c, qty: c.qty + 1 } : c));
          } else {
            setCart([...cart, { ...product, qty: 1 }]);
          }
        };

        const total = cart.reduce((sum, p) => sum + (p.price * p.qty), 0);

        const placeOrder = () => {
          setOrderPlaced(true);
          setCart([]);
          setTimeout(() => {
            setOrderPlaced(false);
            setShowCart(false);
          }, 3000);
        };

        return (
          <div className="min-h-screen bg-gray-50 pb-20">
            <header className="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold">🛒 HUMA TRADERS</h1>
                <p className="text-xs text-emerald-200">Solapur Online Kirana Store</p>
              </div>
              <button 
                onClick={() => setShowCart(!showCart)}
                className="bg-emerald-600 px-3 py-2 rounded-lg font-bold text-sm relative"
              >
                Cart ({cart.reduce((a, b) => a + b.qty, 0)})
              </button>
            </header>

            <div className="bg-emerald-100 p-4 text-center border-b">
              <p className="text-emerald-900 font-bold text-sm">🚚 Solapur Me Home Delivery Uplabdh!</p>
              <p className="text-xs text-emerald-700">Mandi Saste Rato Par Grocery Kharidein</p>
            </div>

            <main className="p-4 max-w-lg mx-auto">
              <h2 className="font-bold text-gray-800 mb-3 text-lg">Featured Grocery Items</h2>

              {orderPlaced && (
                <div className="bg-green-100 border border-green-400 text-green-800 p-3 rounded-lg mb-4 text-center font-bold">
                  🎉 Aapka Order Place Ho Gaya Hai! Huma Traders Aapko Sampark Karega.
                </div>
              )}

              <div className="grid grid-cols-2 gap-3">
                {products.map(p => (
                  <div key={p.id} className="bg-white p-3 rounded-xl border shadow-sm flex flex-col justify-between">
                    <div className="text-center my-2 text-3xl">{p.image}</div>
                    <div>
                      <h3 className="font-bold text-sm text-gray-800">{p.name}</h3>
                      <p className="text-emerald-700 font-bold text-sm mt-1">₹{p.price} / {p.unit}</p>
                    </div>
                    <button 
                      onClick={() => addToCart(p)}
                      className="mt-3 bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-bold w-full active:bg-emerald-800"
                    >
                      + Add to Cart
                    </button>
                  </div>
                ))}
              </div>
            </main>

            {showCart && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-end z-20">
                <div className="bg-white w-full max-w-md h-full p-4 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center border-b pb-3 mb-3">
                      <h2 className="font-bold text-lg">Aapka Cart</h2>
                      <button onClick={() => setShowCart(false)} className="text-gray-500 font-bold text-xl">✕</button>
                    </div>

                    {cart.length === 0 ? (
                      <p className="text-center text-gray-400 my-10">Cart Khali Hai</p>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="flex justify-between items-center border-b pb-2 mb-2 text-sm">
                          <div>
                            <p className="font-semibold">{item.name}</p>
                            <p className="text-xs text-gray-500">₹{item.price} x {item.qty}</p>
                          </div>
                          <span className="font-bold text-emerald-700">₹{item.price * item.qty}</span>
                        </div>
                      ))
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="border-t pt-3">
                      <div className="flex justify-between text-lg font-bold mb-4">
                        <span>Total:</span>
                        <span className="text-emerald-800">₹{total}</span>
                      </div>
                      <button 
                        onClick={placeOrder}
                        className="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold text-center"
                      >
                        Order Place Karein (Cash on Delivery)
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<CustomerApp />);
    </script>
  </body>
</html>
